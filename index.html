<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobilité</title>
<meta name="description" content="Routines de mobilité pour nageuse : minuteur guidé, historique, exercices modifiables.">
<meta name="theme-color" content="#0A6A84" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06191F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mobilité">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;800&display=swap">
<style>
/* Layout : app téléphone, une colonne, barre de navigation en bas. Horloge de bassin + bonhomme animé dans le lecteur. */
:root{
  --bg:#ECF4F3;--tile:rgba(10,106,132,.06);--surface:#FFFFFF;--ink:#0F2930;--muted:#566F75;--line:#C9DBDB;
  --accent:#0A6A84;--accent-ink:#FFFFFF;--accent-soft:#DCEDF0;--hand:#D4432A;--done:#2A8664;--danger:#B7321E;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#06191F;--tile:rgba(79,182,207,.05);--surface:#0C252D;--ink:#E2F0F0;--muted:#8AA6AB;--line:#1D3B44;
    --accent:#4DB4CD;--accent-ink:#04161B;--accent-soft:#12343D;--hand:#FF6B4E;--done:#56C296;--danger:#FF7A66;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--bg);
  background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);background-size:28px 28px;
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.view{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,60px);line-height:.92;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;margin:0}
h3{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:56px;padding:0 28px;border-radius:28px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.icon{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.icon svg{width:20px;height:20px}
.icon.sm{width:36px;height:36px}.icon.sm svg{width:16px;height:16px}
.icon:disabled{opacity:.35;cursor:default}
:is(button,a,input,select,textarea,[tabindex]):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}
.chip.hot{background:var(--hand);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;z-index:30}
.toast.on{opacity:1}

/* Barre de navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--accent)}

/* Accueil */
.hero{display:flex;flex-direction:column;gap:10px}
.streak{display:flex;gap:10px;align-items:stretch}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.week{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.day{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface)}
.day.today{border-color:var(--accent);color:var(--accent)}
.day.on{background:var(--done);border-color:var(--done);color:#fff}
.rlist{display:flex;flex-direction:column;gap:12px}
.rcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.rcard.done{border-color:var(--done)}
.rcard h3{font-size:24px}
.rcard .meta{font-size:14px;color:var(--muted);margin-top:2px}
.rcard .acts{display:flex;flex-direction:column;gap:8px;align-items:center}
.strip{display:flex;gap:4px;margin-top:10px}
.strip i{height:6px;flex:1;border-radius:3px;background:var(--accent-soft)}
.strip i.a{background:var(--accent)}

/* Lecteur */
.player{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:18px}
@media (min-width:640px){.player{grid-template-columns:auto minmax(0,1fr);align-items:start;padding:24px;gap:28px}}
.dial-col{display:flex;flex-direction:column;align-items:center;gap:14px}
.clock{--cw:min(64vw,260px);width:var(--cw);max-width:100%;aspect-ratio:1;position:relative}
.clock svg{width:100%;height:100%;display:block}
.face{fill:var(--bg)}.rim{fill:none;stroke:var(--line);stroke-width:2}
.tick{stroke:var(--muted);stroke-width:1.2;stroke-linecap:round}.tick.major{stroke:var(--ink);stroke-width:2.4}
.num{fill:var(--ink);font-family:var(--display);font-weight:600;font-size:13px}
.hand{stroke:var(--hand);stroke-width:3;stroke-linecap:round}
.track{fill:none;stroke:var(--line);stroke-width:6}
.prog{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round}.prog.prep{stroke:var(--muted)}
.disc{fill:var(--surface)}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.r-label{font-size:max(10px,calc(var(--cw)*.042));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.r-time{font-family:var(--display);font-weight:800;font-size:calc(var(--cw)*.2);line-height:1;font-variant-numeric:tabular-nums}
.r-side{font-size:max(11px,calc(var(--cw)*.046));font-weight:600;color:var(--accent);min-height:1.35em}
.r-side.flash{color:var(--hand)}
.controls{display:flex;align-items:center;justify-content:center;gap:12px}
.now{display:flex;flex-direction:column;gap:8px;min-width:0}
.now h2{font-size:clamp(28px,7.5vw,38px)}
.reps{color:var(--accent);font-weight:600}
.cues{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.cues li{position:relative;padding-left:18px}
.cues li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.demo{width:100%;max-width:360px;aspect-ratio:200/130;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.demo svg{width:100%;height:100%;display:block;color:var(--ink)}
.demo.sm{max-width:120px;border-radius:10px}
.lane{position:relative;display:flex;gap:5px;align-items:center;padding:4px 0}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.bead{position:relative;flex:1;height:14px;border-radius:7px;background:var(--surface);border:1.5px solid var(--line)}
.bead.done{background:var(--accent);border-color:var(--accent)}.bead.cur{border:2.5px solid var(--hand)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}.step.cur{background:var(--accent-soft)}
.step-main{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.step-main:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.step-title{font-weight:600;display:flex;gap:8px;align-items:baseline}
.idx{font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted);min-width:1.1em;font-variant-numeric:tabular-nums}
.step-meta{font-size:14px;color:var(--muted);padding-left:calc(1.1em + 8px)}
.step.done .step-title span:last-child{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.dur{font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;color:var(--muted)}
.check{position:relative;display:grid;place-items:center;width:30px;height:30px;cursor:pointer}
.check input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0}.box path{stroke:#fff}
.check input:checked + .box{background:var(--done);border-color:var(--done)}
.check input:checked + .box svg{opacity:1}
.check input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}

/* Historique */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(4,1fr)}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase}
.cal-grid button{aspect-ratio:1;border-radius:50%;border:1.5px solid transparent;background:transparent;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer;padding:0;position:relative}
.cal-grid button.on{background:var(--done);color:#fff}
.cal-grid button.today{border-color:var(--accent)}
.cal-grid button.sel{outline:3px solid var(--accent);outline-offset:-1px}
.cal-grid button.off{opacity:.3}
.sess{display:flex;flex-direction:column;gap:8px}
.sess .card{padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}

/* Éditeur */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
textarea.in{min-height:90px;resize:vertical;line-height:1.4}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.ecard .head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.ecard .head .idx{font-size:20px}
.ecard summary{cursor:pointer;list-style:none;font-weight:600;color:var(--accent);font-size:14px}
.ecard summary::-webkit-details-marker{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input{width:70px;text-align:center}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle .tk{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s;flex:none}
.toggle .tk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked + .tk{background:var(--accent)}.toggle input:checked + .tk::after{transform:translateX(18px)}
.toggle input:focus-visible + .tk{outline:3px solid var(--accent);outline-offset:2px}
.animpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.animpick button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.animpick button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.animpick .demo{max-width:none;border-radius:8px}
.lib{display:flex;flex-direction:column;gap:8px}
.lib button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px;cursor:pointer}
.lib button .demo{max-width:72px;border-radius:8px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(6,25,31,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:720px;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* Animations des bonshommes */
.fig line,.fig path,.fig polyline{stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig circle.head{fill:currentColor}
.prop{fill:var(--accent-soft);stroke:none}
.prop-line{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.ball{fill:var(--hand)}
.roller{fill:var(--accent);opacity:.75}
.floor{stroke:var(--line);stroke-width:2}
.an{animation-duration:4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.an-openbook{animation-name:openbook;transform-origin:65px 70px}
.an-needle{animation-name:needle;transform-origin:135px 68px;animation-duration:5s}
.an-foamext{animation-name:foamext;transform-origin:95px 92px}
.an-doorpec{animation-name:doorpec;transform-origin:93px 48px;animation-duration:5s}
.an-armL{animation-name:armL;transform-origin:88px 52px}
.an-armR{animation-name:armR;transform-origin:112px 52px}
.an-raise{animation-name:raise;transform-origin:124px 50px}
.an-rotback{animation-name:rotback;transform-origin:76px 50px;animation-duration:3s}
.an-roll{animation-name:roll;animation-duration:5s}
.an-spin{animation-name:spin;animation-duration:5s;transform-origin:center;transform-box:fill-box}
.an-bob{animation-name:bob;animation-duration:3s}
.an-circle{animation-name:circle;transform-origin:124px 50px;animation-duration:3s;animation-timing-function:linear}
.an-catcow{animation-name:catcow;transform-origin:100px 65px}
@keyframes openbook{0%,8%{transform:rotate(0)}40%,55%{transform:rotate(-180deg)}92%,100%{transform:rotate(0)}}
@keyframes needle{0%,5%{transform:rotate(0)}28%,42%{transform:rotate(55deg)}70%,82%{transform:rotate(-170deg)}100%{transform:rotate(0)}}
@keyframes foamext{0%,10%{transform:rotate(0)}45%,60%{transform:rotate(32deg)}95%,100%{transform:rotate(0)}}
@keyframes doorpec{0%,10%{transform:rotate(0)}50%,65%{transform:rotate(-16deg)}100%{transform:rotate(0)}}
@keyframes armL{0%,8%{transform:rotate(0)}45%,58%{transform:rotate(62deg)}95%,100%{transform:rotate(0)}}
@keyframes armR{0%,8%{transform:rotate(0)}45%,58%{transform:rotate(-62deg)}95%,100%{transform:rotate(0)}}
@keyframes raise{0%,10%{transform:rotate(0)}50%,60%{transform:rotate(-75deg)}100%{transform:rotate(0)}}
@keyframes rotback{0%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}100%{transform:rotate(-30deg)}}
@keyframes roll{0%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}100%{transform:translateX(0)}}
@keyframes spin{0%{transform:rotate(0)}25%{transform:rotate(-70deg)}75%{transform:rotate(70deg)}100%{transform:rotate(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes circle{0%{transform:rotate(0)}100%{transform:rotate(-360deg)}}
@keyframes catcow{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-1)}}
@media (prefers-reduced-motion: reduce){.an{animation-duration:16s}}
</style>
</head>

<main id="app"></main>

<script>
(function(){
'use strict';
var VERSION = '1.0.0';

/* ============ Animations (bonshommes) ============ */

/* ============ Données ============ */
var KEY = 'mobilite-app-v1';
var DB = load();
function load(){
  var d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e){ d = null; }
  if (!d || !Array.isArray(d.routines)){
    d = {routines: defaultRoutines(), sessions: [], settings: {prep: 8, sound: true, vibrate: true}, progress: {}};
  }
  d.sessions = d.sessions || []; d.settings = Object.assign({prep: 8, sound: true, vibrate: true}, d.settings || {}); d.progress = d.progress || {};
  return d;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){ toast('Impossible d’enregistrer sur ce téléphone'); } }
function routine(id){ return DB.routines.filter(function(r){ return r.id === id; })[0]; }
function isoLocal(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today(){ return isoLocal(new Date()); }
function fmt(s){ s = Math.max(0, Math.ceil(s - 1e-6)); var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function fmtLong(s){ var m = Math.floor(s / 60), r = s % 60; if (!m) return r + ' s'; return m + ' min' + (r ? ' ' + (r < 10 ? '0' : '') + r : ''); }
function routineSec(r){ return r.steps.reduce(function(a, s){ return a + s.sec + DB.settings.prep; }, 0); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function daysDone(){ var m = {}; DB.sessions.forEach(function(s){ m[s.date] = (m[s.date] || 0) + 1; }); return m; }
function doneToday(rid){ var t = today(); return DB.sessions.some(function(s){ return s.date === t && (!rid || s.routine === rid); }); }
function streaks(){
  var m = daysDone(), cur = 0, best = 0, run = 0, d = new Date(), t = today();
  if (!m[t]) d.setDate(d.getDate() - 1);
  for (var k = 0; k < 400; k++){ if (m[isoLocal(d)]) cur++; else break; d.setDate(d.getDate() - 1); }
  var days = Object.keys(m).sort(), prev = null;
  days.forEach(function(ds){
    var p = ds.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    if (prev && (dt - prev) / 864e5 === 1) run++; else run = 1;
    best = Math.max(best, run); prev = dt;
  });
  return {cur: cur, best: best};
}
/* progrès du jour par routine (cases cochées) */
function prog(rid){
  var p = DB.progress[rid];
  if (!p || p.date !== today()){ p = DB.progress[rid] = {date: today(), done: []}; }
  return p;
}

/* ============ Sons, vibration, écran ============ */
var ac = null;
function audio(){ if (ac) return ac; try { var A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } catch(e){ ac = null; } return ac; }
function beep(freq, dur, delay){
  if (!ac || !DB.settings.sound) return;
  try { var t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.03); } catch(e){}
}
function buzz(p){ if (!DB.settings.vibrate) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
var sound = {
  tick: function(){ beep(880, .09); },
  go: function(){ beep(1320, .38); buzz(200); },
  side: function(){ beep(990, .12); beep(990, .12, .2); buzz([120, 80, 120]); },
  end: function(){ beep(660, .15); beep(880, .25, .18); buzz([150, 80, 150]); },
  finish: function(){ beep(660, .15); beep(880, .15, .18); beep(1320, .45, .36); buzz([200, 100, 200, 100, 300]); }
};
var wl = null;
function lockScreen(){ try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ wl = l; }).catch(function(){ wl = null; }); } catch(e){} }
function unlockScreen(){ try { if (wl) wl.release(); } catch(e){} wl = null; }
var toastT = 0;
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2200); }

/* ============ Routeur ============ */
var app = document.getElementById('app');
var player = null;
function go(hash){ location.hash = hash; }
function route(){
  var h = (location.hash || '#home').slice(1).split('/'), v = h[0], id = h[1];
  if (player && v !== 'play'){ player.destroy(); player = null; }
  document.querySelectorAll('.nav a').forEach(function(a){ a.classList.toggle('on', a.dataset.nav === (v === 'play' || v === 'edit' ? 'home' : v)); });
  if (v === 'play' && routine(id)) return renderPlay(id);
  if (v === 'edit' && routine(id)) return renderEdit(id);
  if (v === 'history') return renderHistory();
  if (v === 'settings') return renderSettings();
  renderHome();
}
window.addEventListener('hashchange', route);

/* ============ Accueil ============ */
function renderHome(){
  var st = streaks(), m = daysDone(), t = today();
  var letters = 'LMMJVSD', now = new Date(), dow = (now.getDay() + 6) % 7, week = '';
  for (var k = 0; k < 7; k++){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + k), iso = isoLocal(d);
    week += '<span class="day' + (m[iso] ? ' on' : '') + (iso === t ? ' today' : '') + '">' + letters[k] + '</span>';
  }
  var h = Math.floor(new Date().getHours());
  var greet = h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
  app.innerHTML =
    '<div class="view">' +
    '<header class="hero"><p class="eyebrow">' + greet + ' · ' + new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}) + '</p>' +
    '<h1>Mobilité</h1>' +
    '<div class="streak"><div class="stat"><b>' + st.cur + '</b><span>' + (st.cur > 1 ? 'jours de suite' : 'jour de suite') + '</span></div>' +
    '<div class="stat"><b>' + st.best + '</b><span>record</span></div>' +
    '<div class="stat"><b>' + DB.sessions.filter(function(s){ return s.date.slice(0, 7) === t.slice(0, 7); }).length + '</b><span>séances ce mois</span></div></div>' +
    '<div class="week" aria-label="Cette semaine">' + week + '</div></header>' +
    '<section class="rlist" id="rlist">' + DB.routines.map(function(r){
      var p = prog(r.id), n = r.steps.filter(function(s){ return p.done.indexOf(s.id) >= 0; }).length, dt = doneToday(r.id);
      return '<article class="rcard' + (dt ? ' done' : '') + '"><div style="min-width:0">' +
        '<h3>' + esc(r.name) + '</h3><p class="meta">' + r.steps.length + ' étapes · ' + fmtLong(routineSec(r)) + (dt ? ' · <span class="chip">faite aujourd’hui</span>' : '') + '</p>' +
        (r.note ? '<p class="meta">' + esc(r.note) + '</p>' : '') +
        '<div class="strip" aria-hidden="true">' + r.steps.map(function(s){ return '<i class="' + (p.done.indexOf(s.id) >= 0 ? 'a' : '') + '"></i>'; }).join('') + '</div></div>' +
        '<div class="acts"><a class="btn primary" href="#play/' + r.id + '">' + (n && n < r.steps.length ? 'Reprendre' : 'Lancer') + '</a>' +
        '<a class="btn ghost sm" href="#edit/' + r.id + '">Modifier</a></div></article>';
    }).join('') + '</section>' +
    '<button type="button" class="btn" id="newR">+ Nouvelle routine</button>' +
    '</div>';
  document.getElementById('newR').addEventListener('click', function(){
    var r = {id: uid(), name: 'Nouvelle routine', note: '', steps: []};
    DB.routines.push(r); save(); go('#edit/' + r.id);
  });
}

/* ============ Lecteur ============ */
function renderPlay(rid){
  var R = routine(rid), S = R.steps, LAST = S.length - 1, PREP = DB.settings.prep, C = 2 * Math.PI * 68;
  if (!S.length){ app.innerHTML = '<div class="view"><p class="eyebrow">Routine vide</p><h1>' + esc(R.name) + '</h1><p>Ajoute des exercices pour pouvoir la lancer.</p><a class="btn primary" href="#edit/' + rid + '">Modifier</a></div>'; return; }
  var P = prog(rid);
  var ticks = '', nums = '';
  for (var k = 0; k < 60; k++){
    var a = k * Math.PI / 30, major = k % 5 === 0, r1 = major ? 100 : 106, r2 = 113;
    ticks += '<line class="tick' + (major ? ' major' : '') + '" x1="' + (120 + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (120 - r1 * Math.cos(a)).toFixed(1) + '" x2="' + (120 + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (120 - r2 * Math.cos(a)).toFixed(1) + '"/>';
    if (major) nums += '<text class="num" text-anchor="middle" dominant-baseline="central" x="' + (120 + 87 * Math.sin(a)).toFixed(1) + '" y="' + (120 - 87 * Math.cos(a)).toFixed(1) + '">' + (k || 60) + '</text>';
  }
  app.innerHTML =
    '<div class="view">' +
    '<div class="between"><a class="btn ghost sm" href="#home">← Routines</a><a class="btn ghost sm" href="#edit/' + rid + '">Modifier</a></div>' +
    '<header><p class="eyebrow" id="eyebrow"></p><h1>' + esc(R.name) + '</h1></header>' +

        '<line id="hand" class="hand" x1="120" y1="120" x2="120" y2="12"/>' +
        '<circle class="track" cx="120" cy="120" r="68"/><circle id="prog" class="prog" cx="120" cy="120" r="68" transform="rotate(-90 120 120)" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '"/>' +
        '<circle class="disc" cx="120" cy="120" r="62"/></svg>' +
        '<div class="readout"><span class="r-label" id="rLabel"></span><span class="r-time" id="rTime"></span><span class="r-side" id="rSide"></span></div></div>' +
        '<div class="controls"><button type="button" class="icon" id="prevBtn" aria-label="Étape précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>' +
        '<button type="button" class="btn primary big" id="playBtn" style="min-width:150px">Commencer</button>' +
        '<button type="button" class="icon" id="nextBtn" aria-label="Étape suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div></div>' +
      '<div class="now"><p class="eyebrow" id="nowMeta"></p><h2 id="nowName"></h2><p class="reps" id="nowReps"></p><div class="demo" id="demo"></div><ul class="cues" id="nowCues"></ul></div>' +
      '<p class="sr" id="status" aria-live="polite"></p>' +
    '</section>' +
    '<section><div class="lane" id="lane">' + S.map(function(s){ return '<span class="bead" id="bead-' + s.id + '"></span>'; }).join('') + '</div>' +

  var $ = function(id){ return document.getElementById(id); };

  function advance(dt, live){

    '<div class="view"><header><p class="eyebrow">Réglages</p><h1>L’app</h1></header>' +
    '<div class="card" style="display:flex;flex-direction:column;gap:14px"><h3>Minuteur</h3>' +
    '<div class="field"><label for="prep">Temps d’installation avant chaque exercice (secondes)</label><div class="stepper"><button type="button" class="icon sm" id="pm" aria-label="Moins">−</button><input class="in" type="number" id="prep" min="0" max="30" value="' + DB.settings.prep + '"><button type="button" class="icon sm" id="pp" aria-label="Plus">+</button></div></div>' +
    '<label class="toggle"><input type="checkbox" id="snd"' + (DB.settings.sound ? ' checked' : '') + '><span class="tk"></span><span>Bips sonores</span></label>' +
    '<label class="toggle"><input type="checkbox" id="vib"' + (DB.settings.vibrate ? ' checked' : '') + '><span class="tk"></span><span>Vibrations</span></label></div>' +
    '<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Installation</h3>' +
    (standalone ? '<p class="muted">L’app est installée sur cet appareil.</p>' : '<p class="muted" style="font-size:14px">Sur Android (Chrome) : menu ⋮ → « Installer l’application » ou « Ajouter à l’écran d’accueil ».</p><button type="button" class="btn primary" id="inst"' + (deferredInstall ? '' : ' hidden') + '>Installer sur ce téléphone</button>') + '</div>' +
    '<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Sauvegarde</h3><p class="muted" style="font-size:14px">Tes routines et ton historique sont enregistrés uniquement sur ce téléphone. Exporte un fichier de temps en temps.</p>' +
    '<div class="row"><button type="button" class="btn" id="exp">Exporter (fichier .json)</button><label class="btn" for="impF">Importer<input type="file" id="impF" accept="application/json,.json" class="sr"></label></div>' +
    '<div class="row"><button type="button" class="btn sm danger" id="reset">Remettre les routines par défaut</button></div><div class="confirm" id="resetC" hidden><span>Remplacer tes routines par celles d’origine ? L’historique est conservé.</span><button type="button" class="btn sm danger" id="resetY">Oui</button><button type="button" class="btn sm" id="resetN">Annuler</button></div></div>' +
    '<p class="muted" style="font-size:13px">Mobilité · version ' + VERSION + ' · Rien ne doit pincer. Douleur vive ou persistante : kiné du sport.</p></div>';
  var $ = function(id){ return document.getElementById(id); };
  function setPrep(v){ DB.settings.prep = Math.max(0, Math.min(30, v | 0)); $('prep').value = DB.settings.prep; save(); }
  $('prep').addEventListener('input', function(){ setPrep(parseInt($('prep').value, 10) || 0); });
  $('pm').addEventListener('click', function(){ setPrep(DB.settings.prep - 1); }); $('pp').addEventListener('click', function(){ setPrep(DB.settings.prep + 1); });
  $('snd').addEventListener('change', function(){ DB.settings.sound = $('snd').checked; save(); if (DB.settings.sound){ audio(); sound.tick(); } });
  $('vib').addEventListener('change', function(){ DB.settings.vibrate = $('vib').checked; save(); buzz(80); });
  var inst = $('inst'); if (inst) inst.addEventListener('click', function(){ if (!deferredInstall) return; deferredInstall.prompt(); deferredInstall.userChoice.then(function(){ deferredInstall = null; renderSettings(); }); });
  $('exp').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(DB, null, 1)], {type: 'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'mobilite-' + today() + '.json'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  $('impF').addEventListener('change', function(e){
    var f = e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){ try { var d = JSON.parse(rd.result); if (!d || !Array.isArray(d.routines)) throw 0; DB = d; DB.sessions = DB.sessions || []; DB.settings = Object.assign({prep: 8, sound: true, vibrate: true}, DB.settings || {}); DB.progress = DB.progress || {}; save(); toast('Sauvegarde importée'); renderSettings(); } catch(err){ toast('Fichier non reconnu'); } };
    rd.readAsText(f);
  });
  $('reset').addEventListener('click', function(){ $('resetC').hidden = false; });
  $('resetN').addEventListener('click', function(){ $('resetC').hidden = true; });
  $('resetY').addEventListener('click', function(){ DB.routines = defaultRoutines(); DB.progress = {}; save(); toast('Routines remises à zéro'); renderSettings(); });
}

/* ============ Démarrage ============ */
route();
if ('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }); }
})();
</script>
</body>
</html>
